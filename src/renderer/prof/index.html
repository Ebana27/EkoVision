<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: http:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professeur — EkoVision</title>
  <link rel="stylesheet" href="../main.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <img src="../assets/ekovision-logo.png" alt="">
      <strong>EKOVISION</strong>
      <span class="mode">Professeur</span>
      <a class="retour" href="../index.html">← Accueil</a>
    </header>

    <h1>Partager mon écran</h1>

    <div class="barre">
      <div class="champ-ip">
        <label for="ip">Adresse IP de cet ordinateur</label>
        <input id="ip" placeholder="192.168.1.24" autocomplete="off">
      </div>
      <button class="btn" id="demarrer">Démarrer</button>
      <button class="btn clair" id="arreter" disabled>Arrêter</button>
      <div class="etat" id="etat"><i></i><span>En attente</span></div>
    </div>

    <div class="grille">
      <div class="ecran">
        <video id="apercu" autoplay muted playsinline></video>
        <p class="vide" id="vide">Votre écran apparaîtra ici</p>
      </div>

      <aside>
        <div class="carte">
          <h2>Élèves connectés (<span id="nombre">0</span>)</h2>
          <div id="liste-eleves"><p class="aucun">Aucun élève pour le moment</p></div>
        </div>
        <div class="carte">
          <h2>Téléphone ou tablette</h2>
          <p class="aucun">Ouvrez cette adresse dans le navigateur :</p>
          <p class="adresse-web" id="adresse-web">—</p>
        </div>
        <div class="carte">
          <h2>Envoyer un fichier</h2>
          <input type="file" id="fichier">
          <button class="btn" id="envoyer">Envoyer à tous</button>
          <div class="etat" id="etat-fichier"><i></i><span>Maximum 20 Mo</span></div>
        </div>
      </aside>
    </div>
  </main>
  <script src="../../../node_modules/peerjs/dist/peerjs.min.js"></script>
  <script src="../outils.js"></script>
  <script src="prof.js"></script>
</body>
</html>
