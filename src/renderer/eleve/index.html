<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: http:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Élève — EkoVision</title>
  <link rel="stylesheet" href="../main.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <img src="../assets/ekovision-logo.png" alt="">
      <strong>EKOVISION</strong>
      <span class="mode">Élève</span>
      <a class="retour" href="../index.html">← Accueil</a>
    </header>

    <h1>Rejoindre la classe</h1>

    <div class="grille">
      <aside>
        <form class="carte" id="formulaire">
          <h2>Vos informations</h2>
          <div class="champ">
            <label for="prenom">Prénom</label>
            <input id="prenom" placeholder="Ex. Amina" required maxlength="40" autocomplete="given-name">
          </div>
          <div class="champ">
            <label for="nom">Nom</label>
            <input id="nom" placeholder="Ex. Diallo" required maxlength="40" autocomplete="family-name">
          </div>
          <div class="champ">
            <label for="ip">Adresse du professeur</label>
            <input id="ip" placeholder="Ex. 192.168.1.24" required maxlength="21" autocomplete="off">
          </div>
          <button class="btn" id="rejoindre" type="submit">Rejoindre</button>
          <button class="btn clair" id="quitter" type="button" hidden>Se déconnecter</button>
          <div class="etat" id="etat"><i></i><span>Non connecté</span></div>
        </form>

        <div class="carte">
          <h2>Fichiers reçus</h2>
          <p class="aucun" id="aucun-fichier">Aucun fichier pour le moment</p>
          <div id="liste-fichiers"></div>
        </div>
      </aside>

      <section>
        <div class="ecran" id="ecran">
          <video id="video" autoplay playsinline></video>
          <p class="vide" id="vide">Le partage du professeur apparaîtra ici</p>
          <button class="btn clair" id="plein-ecran" type="button" hidden>Plein écran</button>
        </div>
      </section>
    </div>
  </main>
  <script src="../../../node_modules/peerjs/dist/peerjs.min.js"></script>
  <script src="../outils.js"></script>
  <script src="eleve.js"></script>
</body>
</html>
